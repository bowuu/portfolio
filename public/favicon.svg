<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
    <defs>
        <filter id="contrast" x="-15%" y="-15%" width="130%" height="130%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
        </filter>
    </defs>
    <!-- Maximized Floating Obsidian Prism (Full Bleed Favicon) -->
    <g filter="url(#contrast)" stroke="#08090d" stroke-width="3" stroke-linejoin="round">
        <!-- Left Pillar Facet (Pure White - Spine of B) -->
        <rect x="6" y="6" width="42" height="116" rx="6" fill="#ffffff"/>
        
        <!-- Upper Prismatic Wedge (Signal Orange - Upper Bowl & W Peak) -->
        <path d="M 54 6 L 120 40 C 122 41 122 43 120 44 L 54 61 Z" fill="#ff6b00"/>
        
        <!-- Lower Prismatic Wedge (Deep Amber - Lower Bowl & W Base) -->
        <path d="M 54 67 L 120 84 C 122 85 122 87 120 88 L 54 122 Z" fill="#c2410c"/>
    </g>
</svg>
