<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#18181c"/>
            <stop offset="100%" stop-color="#09090b"/>
        </linearGradient>
        <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff8c26"/>
            <stop offset="100%" stop-color="#ea580c"/>
        </linearGradient>
        <linearGradient id="layerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f97316"/>
            <stop offset="100%" stop-color="#ea580c"/>
        </linearGradient>
        <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
            <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
        </filter>
    </defs>
    
    <!-- Obsidian Carbon Base -->
    <rect width="128" height="128" rx="28" fill="url(#bg)"/>
    
    <!-- High-Precision Orange Rim -->
    <rect x="2" y="2" width="124" height="124" rx="26" stroke="url(#rimGrad)" stroke-width="3" stroke-opacity="0.9"/>
    <rect x="7" y="7" width="114" height="114" rx="21" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- High-Impact Solid 'B' with Layer Lines & ATE Contacts -->
    <g filter="url(#shadow)">
        <!-- The Bold 'B' in Signal Orange -->
        <path fill-rule="evenodd" clip-rule="evenodd" d="M32 20 h36 c12 0 21 8.5 21 19.5 c0 7.2 -4.5 13.5 -11.2 16.8 c8.8 3.2 15.2 10.8 15.2 20.7 c0 13.5 -11.5 24 -25.5 24 H32 V20 z M48 35 v16 h19 c5.2 0 9.5 -3.5 9.5 -8 s-4.3 -8 -9.5 -8 H48 z M48 66 v21 h21 c6.8 0 12 -4.5 12 -10.5 s-5.2 -10.5 -12 -10.5 H48 z" fill="url(#bGrad)"/>
        
        <!-- Subtle FDM 3D Layer Highlights -->
        <path d="M32 30 h35 c10 0 17 6 17 9 M32 45 h47 M32 60 h51 M32 75 h56 M32 90 h48" stroke="url(#layerGrad)" stroke-width="2" stroke-linecap="round"/>
        
        <!-- Silicon / ATE Hardware Probe Pins -->
        <circle cx="40" cy="27" r="2.5" fill="#fafafa"/>
        <circle cx="40" cy="58" r="2.5" fill="#fafafa"/>
        <circle cx="40" cy="94" r="2.5" fill="#fafafa"/>
    </g>
</svg>
