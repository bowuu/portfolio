<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#14151a"/>
            <stop offset="100%" stop-color="#08090c"/>
        </linearGradient>
        <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff8c26"/>
            <stop offset="100%" stop-color="#ea580c"/>
        </linearGradient>
    </defs>
    
    <!-- Obsidian Silicon Base -->
    <rect width="128" height="128" rx="28" fill="url(#bg)"/>
    
    <!-- High-Precision Orange Rim -->
    <rect x="2" y="2" width="124" height="124" rx="26" stroke="url(#rim)" stroke-width="2.5" stroke-opacity="0.85"/>
    <rect x="6" y="6" width="116" height="116" rx="22" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- The Obsidian Prism (B + W Elemental Monogram) -->
    <g>
        <!-- Left Pillar Facet (Pure White - Spine of B) -->
        <path d="M 28 28 H 54 V 100 H 28 Z" fill="#ffffff"/>
        
        <!-- Upper Prismatic Wedge (Signal Orange - Upper Bowl & W Peak) -->
        <path d="M 60 28 L 100 50 L 60 62 Z" fill="#ff6b00"/>
        
        <!-- Lower Prismatic Wedge (Deep Amber - Lower Bowl & W Base) -->
        <path d="M 60 66 L 100 78 L 60 100 Z" fill="#c2410c"/>
    </g>
</svg>
